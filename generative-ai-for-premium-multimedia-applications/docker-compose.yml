version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - zookeeper

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  producer:
    build: ./producer-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - kafka
      - redis
    restart: unless-stopped

  consumer:
    build: ./consumer-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    depends_on:
      - kafka
      - redis
    restart: unless-stopped

  esrgan:
    build:
      context: ./esrgan-engine
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - PORT=7001
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - redis
    restart: unless-stopped
