version: '3.8'

services:
  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  producer:
    build: ./producer-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - kafka
      - redis

  consumer:
    build: ./consumer-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    depends_on:
      - kafka
      - redis

  # Optional: ESRGAN model server
  esrgan:
    image: your-esrgan-image
    ports:
      - "7001:7001"
